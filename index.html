<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7c5cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dot Dipper</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Home / library ===== -->
  <section id="home" class="view">
    <header class="home-header">
      <div class="title-row">
        <h1><span class="logo-dot"></span>Dot Dipper</h1>
        <button id="helpBtn" class="help-btn" aria-label="How to play">?</button>
      </div>
      <p class="tagline">Tap the gems to bring the picture to life ✨</p>
      <div class="header-row">
        <div id="dotStat" class="dot-stat"></div>
        <button id="shareAppBtn" class="pill-btn ghost-pill">🔗 Share app</button>
        <button id="installBtn" class="pill-btn hidden">📲 Install app</button>
      </div>
    </header>
    <div id="projectList" class="project-list"></div>
    <footer class="home-footer">Made by Ryan with help from his friend Claude during the Dlugosz/Heintz family vacation 2026</footer>
    <button id="newBtn" class="fab" aria-label="New picture">＋</button>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" class="view hidden">
    <div class="editor-top">
      <button id="backBtn" class="icon-btn" aria-label="Back">‹</button>
      <div class="editor-title" id="editorTitle">Picture</div>
      <span id="progressPct" class="pct">0%</span>
      <div class="tools">
        <button id="undoBtn" class="icon-btn" aria-label="Undo">↶</button>
        <button id="handBtn" class="icon-btn" aria-label="Move / zoom">✋</button>
        <button id="eraseBtn" class="icon-btn" aria-label="Erase">⌫</button>
        <button id="brushBtn" class="icon-btn brush-btn" aria-label="Brush size">🖌<span id="brushBadge" class="badge">1</span></button>
        <button id="settingsBtn" class="icon-btn" aria-label="Options">⚙</button>
        <button id="refBtn" class="icon-btn" aria-label="Show finished picture">👁</button>
        <button id="fitBtn" class="icon-btn" aria-label="Fit to screen">⤢</button>
      </div>
    </div>
    <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    <canvas id="board"></canvas>
    <div id="palette" class="palette"></div>
  </section>

  <!-- ===== Reference (finished-picture peek) ===== -->
  <div id="reference" class="reference hidden">
    <img id="referenceImg" alt="What the finished picture looks like">
    <div class="reference-cap">What it will look like — tap to close</div>
  </div>

  <!-- ===== New project modal ===== -->
  <div id="newModal" class="modal hidden">
    <div class="modal-card" id="newModalCard"></div>
  </div>

  <!-- ===== Celebration ===== -->
  <div id="celebrate" class="celebrate hidden">
    <canvas id="confetti"></canvas>
    <div class="celebrate-card">
      <div class="celebrate-emoji">🎉</div>
      <h2>All done!</h2>
      <p>You finished your picture. Amazing work!</p>
      <button id="celebrateSave" class="btn-primary">📷 View &amp; save</button>
      <button id="celebrateClose" class="btn-ghost">Yay!</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
