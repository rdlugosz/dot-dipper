<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7c5cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Dot Dipper</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Home / library ===== -->
  <section id="home" class="view">
    <header class="home-header">
      <h1><span class="logo-dot"></span>Dot Dipper</h1>
      <p class="tagline">Tap the gems to bring the picture to life ✨</p>
    </header>
    <div id="projectList" class="project-grid"></div>
    <button id="newBtn" class="fab" aria-label="New picture">＋</button>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" class="view hidden">
    <div class="editor-top">
      <button id="backBtn" class="icon-btn" aria-label="Back">‹</button>
      <div class="editor-title" id="editorTitle">Picture</div>
      <div class="progress-wrap">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <span id="progressPct">0%</span>
      </div>
      <div class="tools">
        <button id="undoBtn" class="icon-btn" aria-label="Undo">↶</button>
        <button id="handBtn" class="icon-btn" aria-label="Move / zoom">✋</button>
        <button id="eraseBtn" class="icon-btn" aria-label="Erase">⌫</button>
        <button id="fitBtn" class="icon-btn" aria-label="Fit to screen">⤢</button>
      </div>
    </div>
    <canvas id="board"></canvas>
    <div id="palette" class="palette"></div>
  </section>

  <!-- ===== New project modal ===== -->
  <div id="newModal" class="modal hidden">
    <div class="modal-card" id="newModalCard"></div>
  </div>

  <!-- ===== Celebration ===== -->
  <div id="celebrate" class="celebrate hidden">
    <canvas id="confetti"></canvas>
    <div class="celebrate-card">
      <div class="celebrate-emoji">🎉</div>
      <h2>All done!</h2>
      <p>You finished your picture. Amazing work!</p>
      <button id="celebrateClose" class="btn-primary">Yay!</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
